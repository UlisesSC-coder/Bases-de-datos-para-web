<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mini sistema{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        {% block nav %}
        <a href="{{ url_for('users.index') }}">Inicio</a>
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('users.register') }}">Nuevo usuario</a>
            <a href="{{ url_for('users.profile', id=current_user.id) }}">
                {{ current_user.username|capitalize }}
            </a>
            <a href="{{ url_for('users.logout') }}">Salir</a>
        {% else %}
            <a href="{{ url_for('users.login') }}">Entrar</a>
            <a href="{{ url_for('users.register') }}">Registrarse</a>
        {% endif %}
        {% endblock %}
    </nav>

    {% include "_flash.html" %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
